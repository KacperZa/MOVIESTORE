services:
  backend:
    restart: unless-stopped
    environment:
      DEBUG: "true"
      API_KEY: ${API_KEY}
      TMDB_TOKEN: ${TMDB_TOKEN}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      DATABASE_URL: mongodb://mongo:27017/moviestore
      REDIS_URL: redis://redis:6379
    build: ./server
    ports:
      - "${APP_PORT}:5000"
    depends_on:
      mongo:
        condition: service_healthy
        restart: true
      redis:
        condition: service_started
  frontend: 
    build: ./moviestore
    environment:
      DEBUG: "true"
      TARGET: http://backend:5000
    ports:
      - "5173:5173"
  redis:
    image: redis:alpine
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
  mongo: 
    image: mongo:7
    ports:
      - "${MONGO_PORT}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: